<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Sistema de Códigos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-8">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-server"></i>
                </div>
                <span class="font-bold text-lg">CODEX <span class="text-indigo-400">ADMIN</span></span>
            </div>
            <nav class="space-y-2">
                <a href="#" class="flex items-center space-x-3 bg-indigo-600/10 text-indigo-400 px-4 py-3 rounded-xl font-medium text-sm">
                    <i class="fa-solid fa-chart-pie"></i> <span>Dashboard</span>
                </a>
                <a href="#" class="flex items-center space-x-3 text-slate-400 hover:bg-slate-800 hover:text-white px-4 py-3 rounded-xl font-medium text-sm transition">
                    <i class="fa-solid fa-envelope-circle-check"></i> <span>Servidores IMAP</span>
                </a>
                <a href="#" class="flex items-center space-x-3 text-slate-400 hover:bg-slate-800 hover:text-white px-4 py-3 rounded-xl font-medium text-sm transition">
                    <i class="fa-solid fa-list-check"></i> <span>Plataformas</span>
                </a>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800">
            <a href="/" class="flex items-center space-x-2 text-slate-400 hover:text-white text-xs">
                <i class="fa-solid fa-arrow-left"></i> <span>Regresar al buscador</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow p-6 md:p-10 overflow-y-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black text-white">Panel de Control</h1>
            <span class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1 rounded-full font-semibold border border-emerald-500/20">
                <i class="fa-solid fa-circle text-[8px] mr-1"></i> Sistema Operativo
            </span>
        </header>

        <!-- Métricas Rápidas -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                <span class="text-xs text-slate-400 uppercase font-semibold">Consultas Totales</span>
                <h3 class="text-3xl font-black mt-2 text-indigo-400">1,248</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                <span class="text-xs text-slate-400 uppercase font-semibold">Consultas Hoy</span>
                <h3 class="text-3xl font-black mt-2 text-emerald-400">94</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                <span class="text-xs text-slate-400 uppercase font-semibold">Buzones IMAP Activos</span>
                <h3 class="text-3xl font-black mt-2 text-amber-400">3</h3>
            </div>
        </div>

        <!-- Configuración de Servidores IMAP -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-lg font-bold mb-4 flex items-center">
                <i class="fa-solid fa-sliders text-indigo-500 mr-2"></i> Configurar Buzón Receptor IMAP
            </h2>
            <form id="imapForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Servidor IMAP (Host)</label>
                    <input type="text" placeholder="imap.gmail.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Puerto</label>
                    <input type="number" value="993" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Correo Electrónico</label>
                    <input type="email" placeholder="tucorreo@dominio.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Contraseña de Aplicación</label>
                    <input type="password" placeholder="••••••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white">
                </div>
                <div class="md:col-span-2 flex justify-end mt-2">
                    <button type="button" onclick="alert('Configuración guardada correctamente')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition">
                        Guardar Configuración IMAP
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
