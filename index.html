<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODE CODEX - Panel Administrativo</title>
    <!-- Tailwind CSS para mantener el diseño profesional exacto -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b132b] text-white font-sans antialiased min-h-screen flex">

    <!-- Barra Lateral (Sidebar) -->
    <aside class="w-64 bg-[#1c2541] border-r border-gray-800 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-6 text-xl font-bold tracking-wider text-yellow-400 flex items-center gap-2">
                CODE<span class="text-white">CODEX</span>
            </div>
            <nav class="mt-6 space-y-1 px-4">
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-[#3a506b] hover:text-white transition">Dashboard</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-[#3a506b] text-white font-medium">Plataformas</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-[#3a506b] hover:text-white transition">Servidores</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-[#3a506b] hover:text-white transition">Mi sitio público</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-[#3a506b] hover:text-white transition">Registros</a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-800">
            <button class="w-full flex items-center gap-2 px-4 py-2 text-red-400 hover:bg-red-500/10 rounded-lg transition">Cerrar Sesión</button>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 flex flex-col min-w-0">
        <!-- Cabecera Superior -->
        <header class="h-16 bg-[#1c2541]/50 border-b border-gray-800 flex items-center justify-between px-8">
            <div>
                <h1 class="text-xl font-bold">Plataformas</h1>
                <p class="text-xs text-gray-400">Gestiona las plataformas de streaming y sus códigos de verificación</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-sm text-gray-300">Hola, <strong>Mauricio</strong></span>
                <div class="w-9 h-9 rounded-full bg-[#3a506b] flex items-center justify-center font-bold">M</div>
            </div>
        </header>

        <!-- Cuerpo del Panel -->
        <div class="p-8 space-y-6">
            
            <!-- Barra de Acciones y Botón Nueva Plataforma -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-[#1c2541] p-4 rounded-xl border border-gray-800">
                <input type="text" placeholder="Nombre o descripción..." class="w-full md:w-96 bg-[#0b132b] border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
                <button onclick="abrirModalNuevaPlataforma()" class="w-full md:w-auto bg-yellow-400 hover:bg-yellow-500 text-gray-950 font-bold px-5 py-2.5 rounded-lg transition flex items-center justify-center gap-2">
                    + Nueva Plataforma
                </button>
            </div>

            <!-- Sección de Consulta de Códigos en Vivo (Integrada con Google Apps Script) -->
            <div class="bg-[#1c2541] p-6 rounded-xl border border-gray-800 shadow-lg">
                <h3 class="text-lg font-bold mb-3 text-yellow-400">Consultar Código en Vivo por Correo</h3>
                <div class="flex gap-3">
                    <input type="email" id="inputCorreoConsulta" placeholder="ejemplo@gmail.com" class="flex-1 bg-[#0b132b] border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-yellow-400">
                    <button onclick="ejecutarConsultaGoogleScript()" class="bg-yellow-400 hover:bg-yellow-500 text-gray-950 font-bold px-6 py-2 rounded-lg transition">Consultar</button>
                </div>
                <div id="resultadoConsultaVivo" class="mt-4 text-sm font-medium"></div>
            </div>

            <!-- Tabla de Plataformas -->
            <div class="bg-[#1c2541] rounded-xl border border-gray-800 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 text-xs uppercase text-gray-400 bg-[#161f36]">
                            <th class="py-4 px-6">Plataforma</th>
                            <th class="py-4 px-6">Asuntos Configurados</th>
                            <th class="py-4 px-6">Estado</th>
                            <th class="py-4 px-6 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-800 text-sm">
                        <tr class="hover:bg-[#222d4a] transition">
                            <td class="py-4 px-6 flex items-center gap-3 font-bold">
                                <div class="w-8 h-8 rounded bg-red-600 flex items-center justify-center text-xs">CR</div>
                                CRUNCHYROLL
                            </td>
                            <td class="py-4 px-6">
                                <span class="bg-blue-900/50 text-blue-300 text-xs px-2.5 py-1 rounded-full border border-blue-700">1 asuntos</span>
                            </td>
                            <td class="py-4 px-6">
                                <span class="bg-green-500/10 text-green-400 text-xs px-2.5 py-1 rounded-full border border-green-500/20">Activo</span>
                            </td>
                            <td class="py-4 px-6 text-right space-x-2">
                                <button onclick="alert('Redirigiendo a edición de asuntos...')" class="text-gray-400 hover:text-yellow-400 transition">✏️</button>
                                <button onclick="alert('¿Eliminar plataforma?')" class="text-gray-400 hover:text-red-400 transition">🗑️</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- Script de Integración con Google Apps Script -->
    <script>
    async function ejecutarConsultaGoogleScript() {
        const correo = document.getElementById('inputCorreoConsulta').value.trim();
        const contenedor = document.getElementById('resultadoConsultaVivo');

        if (!correo) {
            alert("Por favor, ingresa un correo.");
            return;
        }

        contenedor.innerHTML = "<span class='text-yellow-300'>Consultando buzón en Google...</span>";

        // URL directa de tu Google Apps Script funcional
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3lmpp3cjfbqepZipEoJEjxjr76zTO-GcpqmOgQ5DytkFwkQsPjY7wp6rUEBNsf4Ek/exec';

        try {
            const respuesta = await fetch(`${GOOGLE_SCRIPT_URL}?correo=${encodeURIComponent(correo)}`);
            const resultado = await respuesta.json();

            if (resultado.success) {
                contenedor.innerHTML = `
                    <div class="p-3 bg-green-500/10 border border-green-500/30 rounded-lg">
                        <span class="text-green-400 font-bold">¡Código encontrado!</span><br>
                        <strong>Código:</strong> <span class="text-yellow-300 text-lg">${resultado.codigo}</span><br>
                        <strong>Asunto:</strong> ${resultado.asunto}
                    </div>
                `;
            } else {
                contenedor.innerHTML = `<span class="text-red-400">${resultado.message || "No se encontró ningún código."}</span>`;
            }
        } catch (error) {
            console.error("Error:", error);
            contenedor.innerHTML = `<span class="text-red-400">Error al conectar con el servidor de consulta.</span>`;
        }
    }

    function abrirModalNuevaPlataforma() {
        alert("Aquí se abrirá el formulario para registrar una nueva plataforma, slug e imagen.");
    }
    </script>

</body>
</html>
