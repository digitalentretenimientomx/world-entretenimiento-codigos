<!-- Ejemplo de la estructura en tu HTML -->
<div class="card">
    <h3>Consultar Código de Verificación</h3>
    <input type="email" id="inputCorreo" placeholder="Ingresa el correo a consultar" required>
    <button onclick="realizarConsulta()">Consultar Código</button>
    
    <div id="resultadoConsulta" style="margin-top: 15px; font-weight: bold;"></div>
</div>

<script>
async function realizarConsulta() {
    const correoInput = document.getElementById('inputCorreo').value.trim();
    const divResultado = document.getElementById('resultadoConsulta');

    if (!correoInput) {
        alert("Por favor, ingresa un correo.");
        return;
    }

    divResultado.innerHTML = "Consultando código en el buzón...";

    try {
        const respuesta = await fetch('/api/consultar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ correo: correoInput })
        });

        const resultado = await respuesta.json();

        if (resultado.success) {
            divResultado.innerHTML = `
                <span style="color: green;">¡Código encontrado!</span><br>
                <strong>Código:</strong> ${resultado.codigo}<br>
                <strong>Asunto:</strong> ${resultado.asunto}
            `;
        } else {
            divResultado.innerHTML = `<span style="color: red;">${resultado.message || "No se encontró ningún código."}</span>`;
        }
    } catch (error) {
        console.error("Error:", error);
        divResultado.innerHTML = `<span style="color: red;">Error al conectar con el servidor de consulta.</span>`;
    }
}
</script>
